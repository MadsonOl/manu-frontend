name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (com cobertura)
        run: npm run test:coverage

      - run: npm run build

      - name: Verify dist was generated
        run: test -d dist && echo "Build successful — dist/ exists"
